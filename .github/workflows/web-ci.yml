name: Playstate web CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    # Pin the runner image to avoid the ubuntu-latest migration changing the
    # build environment unexpectedly.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # package.json is the single source of truth for the pnpm version.
      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @playstate/web typecheck

      - name: Build web showcase
        run: pnpm --filter @playstate/web build
